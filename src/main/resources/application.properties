spring.application.name=personal-finance-tracker

## Database Properties
spring.datasource.url = jdbc:mysql://localhost:3306/demo?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username = ${DB_USERNAME}
spring.datasource.password = ${DB_PASSWORD}

## Hibernate Properties

# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto = update
spring.sql.init.mode=never

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=3600
app.jwt.issuer=demo-api

logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.verification.expiry-hours=24

app.report.storage-dir=${REPORT_DIR:./reports}

spring.config.import=optional:file:.env[.properties]

